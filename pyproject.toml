[project]
name = "bank-ontology-studio"
version = "0.1.0"
description = "M1 local development: immutable source, AST facts, reviewed ontology"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3",
  "httpx>=0.28,<1", "jsonschema>=4.23,<5", "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4", "neo4j>=5.28,<7",
  "cryptography>=44,<50", "mcp==1.26.0", "tiktoken==0.12.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

