name: bank-ontology-m2
x-app: &app
  image: bank-ontology-platform:m2-local
  build: .
  env_file: .data/m2/compose.env
  environment:
    BOS_DATA_DIR: /data
    BOS_DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD:?Run scripts/setup_m2.py}@postgres:5432/studio
    BOS_NEO4J_URI: bolt://neo4j:7687
    BOS_CODEGRAPH_URL: http://codegraph:8080
    BOS_CODEGRAPH_TOKEN: ${BOS_CODEGRAPH_TOKEN:?Run scripts/setup_m2.py}
    BOS_NEO4J_USER: neo4j
    BOS_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run scripts/setup_m2.py}
  volumes:
    - ./.data/m2/runtime:/data
  depends_on:
    codegraph:
      condition: service_healthy
    postgres:
      condition: service_healthy
    neo4j:
      condition: service_healthy
  networks: [default, analysis]
  restart: unless-stopped
services:
  codegraph:
    image: bank-ontology-codegraph:joern-4.0.662
    build: analyzers/joern
    environment:
      BOS_CODEGRAPH_TOKEN: ${BOS_CODEGRAPH_TOKEN}
    volumes:
      - ./.data/m2/runtime/snapshots:/data/snapshots:ro
      - ./.data/m2/codegraph:/artifacts
    networks: [analysis]
    mem_limit: 4g
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 4
    restart: unless-stopped
  postgres:
    image: ${POSTGRES_IMAGE:?Run scripts/setup_m2.py}
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U studio -d studio']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26.12-community@sha256:9f75e8df4325a24f00fdd7a8c0bcce650a58375049b1058e496e8b43d6c36b37
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  api:
    <<: *app
    ports:
      - 127.0.0.1:${BOS_M2_PORT:-8002}:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/readiness',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    profiles: [worker]
    command: [python, -m, backend.worker]
volumes:
  postgres-data:
  neo4j-data:

networks:
  analysis:
    internal: true
